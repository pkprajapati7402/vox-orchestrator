name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  LOG_LEVEL: WARNING
  LLM_PRIMARY_PROVIDER: mock
  LLM_FALLBACK_PROVIDER: none
  EVAL_LLM_PROVIDER: mock
  TWILIO_VALIDATE_SIGNATURES: "false"
  DATABASE_URL: sqlite+aiosqlite:///./ci.sqlite3

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.6.9
      - run: ruff check app eval tests
      - run: ruff format --check app eval tests

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --cov=app --cov=eval --cov-report=term-missing
      - name: Check migrations apply cleanly
        run: |
          alembic upgrade head
          alembic downgrade base

  eval:
    name: Agent eval suite
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Baseline eval (gates the build)
        run: |
          python -m eval.run_eval \
            --label ci \
            --quiet \
            --out-dir eval/reports/ci \
            --min-task-completion 0.90 \
            --min-tool-sequence 0.90 \
            --max-hallucination 0.05
      - name: Regression check against the committed baseline
        run: |
          python -m eval.run_eval \
            --label ci-vs-baseline \
            --quiet \
            --out-dir eval/reports/ci \
            --compare eval/reports/baseline.json
      - name: Publish the report in the job summary
        if: always()
        run: cat eval/reports/ci/ci.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: eval/reports/ci/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vox-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
