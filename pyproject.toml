[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vox-orchestrator"
version = "0.1.0"
description = "Agentic AI cold-calling voice agent: Pipecat Flows state machine, validated tool-calling, cost tracking and an offline eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krypto-etox" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "twilio>=9.0",
    "redis>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Real-time voice stack. Heavy (torch-free but large); not needed for the API,
# the eval harness or the tests.
voice = [
    "pipecat-ai[silero,elevenlabs,groq,deepgram,websocket]>=0.0.60",
    "pipecat-ai-flows>=0.0.12",
]
tracing = [
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation>=0.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
vox = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.coverage.run]
source = ["app", "eval"]
omit = ["*/pipeline/pipecat_runner.py"]
